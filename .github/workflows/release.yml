name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "9.15.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Build all platforms
        run: |
          pnpm run build:h5
          pnpm run build:mp-weixin
          node scripts/verify-mp-build.cjs
          pnpm run build:app
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          VITE_CLOUD_ENV: ${{ secrets.PROD_CLOUD_ENV }}
          VITE_HASH_SALT: ${{ secrets.VITE_HASH_SALT }}

      - name: Create release archives
        run: |
          cd dist
          tar -czf ../bujiaban-h5-${GITHUB_REF#refs/tags/}.tar.gz build/h5/
          tar -czf ../bujiaban-mp-weixin-${GITHUB_REF#refs/tags/}.tar.gz build/mp-weixin/
          tar -czf ../bujiaban-app-${GITHUB_REF#refs/tags/}.tar.gz build/app/

      - name: Generate changelog
        id: changelog
        run: |
          # 生成变更日志
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 新版本发布

            ### 变更内容
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### 📦 构建产物
            - H5版本: `bujiaban-h5-${{ github.ref_name }}.tar.gz`
            - 微信小程序版本: `bujiaban-mp-weixin-${{ github.ref_name }}.tar.gz`
            - App版本: `bujiaban-app-${{ github.ref_name }}.tar.gz`

            ### 🔧 部署说明
            1. 下载对应平台的构建产物
            2. 解压到目标目录
            3. 按照部署文档进行配置
          draft: false
          prerelease: false

      - name: Upload H5 build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bujiaban-h5-${{ github.ref_name }}.tar.gz
          asset_name: bujiaban-h5-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload WeChat Mini Program build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bujiaban-mp-weixin-${{ github.ref_name }}.tar.gz
          asset_name: bujiaban-mp-weixin-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload App build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bujiaban-app-${{ github.ref_name }}.tar.gz
          asset_name: bujiaban-app-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip
